<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React JS Masterclass · Visual Tutorial</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --line:#2b3440;
    --ink:#e6edf3; --dim:#8b98a5; --faint:#5b6672;
    --accent:#61dafb; --accent2:#4cc2ff; --good:#3fb950; --warn:#ff7b72; --violet:#bc8cff;
    --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height: 100vh; overflow: hidden; }
  body {
    display: flex;
    background:
      radial-gradient(1200px 600px at 12% -10%, #1b2432 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  
  /* Sidebar */
  .sidebar {
    width: 320px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    z-index: 10;
  }
  .sidebar .logo {
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding: 0 10px;
  }
  .sidebar .logo svg { width: 32px; height: 32px; color: var(--accent); animation: spin 10s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .sidebar .logo h2 { margin: 0; font-size: 18px; color: var(--ink); line-height: 1.2; }
  .nav-group { margin-bottom: 10px; overflow-y: auto; flex: 1; padding-right: 5px; }
  .nav-group::-webkit-scrollbar { width: 6px; }
  .nav-group::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  .nav-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin: 20px 10px 10px; }
  .menu-item {
    padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--dim);
    transition: .2s; display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
  }
  .menu-item:hover { background: #21262d; color: var(--ink); }
  .menu-item.active { background: #61dafb15; color: var(--accent); font-weight: 600; border-left: 3px solid var(--accent); border-top-left-radius: 2px; border-bottom-left-radius: 2px; }
  .menu-item .n { width: 22px; height: 22px; border-radius: 6px; background: #252d38; color: var(--dim); display: grid; place-items: center; font-size: 11px; font-weight: bold; flex-shrink: 0; }
  .menu-item.active .n { background: var(--accent); color: #0d1117; }

  /* Main Area */
  .main-area {
    flex: 1; overflow-y: auto; padding: 30px 40px; position: relative;
  }
  .wrap { max-width: 1050px; margin: 0 auto; }
  .eyebrow { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
  h1 { margin: 0 0 10px; font-size: clamp(24px, 2.5vw, 32px); letter-spacing: -.02em; }
  .sub { color: var(--dim); margin-top: 0; font-size: 15px; line-height: 1.6; max-width: 76ch; margin-bottom: 25px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; min-height: 680px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; letter-spacing: -.01em; color: var(--ink); }
  .card .rule { color: var(--dim); font-size: 13.5px; margin: 0 0 16px; line-height: 1.6; }
  .card .rule code { background: #0e1620; border: 1px solid #23384a; padding: 1px 6px; border-radius: 5px; font-family: var(--mono); font-size: 13px; color: var(--accent); }

  /* --------- main split --------- */
  .split { display: grid; grid-template-columns: 1fr 340px; gap: 16px; flex: 1; }
  @media(max-width:1100px) { .split { grid-template-columns: 1fr; } }

  /* --------- worksheet --------- */
  .board {
    position: relative; background: linear-gradient(180deg, #10161e, #0c1117);
    border: 1px solid var(--line); border-radius: 14px; min-height: 420px; padding: 22px 18px;
    overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100%;
  }
  .board::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(#ffffff05 1px, transparent 1px), linear-gradient(90deg, #ffffff05 1px, transparent 1px);
    background-size: 26px 26px; }
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; overflow: visible; }
  .sheet { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }

  /* Elements for animations */
  .box {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 10px; border: 2px solid var(--line); background: #161b22;
    padding: 12px 20px; font-family: var(--mono); color: var(--ink); font-weight: 600; font-size: 14px;
    transition: all 0.4s ease; opacity: 0; transform: translateY(10px); text-align: center;
  }
  .box.in { opacity: 1; transform: none; }
  .box.highlight { border-color: var(--accent); box-shadow: 0 0 15px rgba(97, 218, 251, 0.2); }
  .box.success { border-color: var(--good); background: #0f2318; color: var(--good); }
  .box.warn { border-color: var(--warn); background: #2a1416; color: var(--warn); }
  .box.violet { border-color: var(--violet); background: #1b1428; color: var(--violet); }
  .box.dim { opacity: 0.5; }
  
  .dom-node {
    width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--dim);
    display: grid; place-items: center; background: #131b25; z-index: 5;
    transition: all 0.5s; position: absolute; font-size: 20px; font-weight: bold;
  }
  .dom-node.sm { width: 45px; height: 45px; font-size: 14px; }
  .dom-node.vdom { border-color: var(--violet); color: var(--violet); background: #1b1428; }
  .dom-node.real { border-color: var(--good); color: var(--good); background: #0f2318; }
  .dom-node.update { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 15px var(--accent); background: #0c202a; transform: scale(1.1); }
  .dom-node.del { border-color: var(--warn); color: var(--warn); background: #2a1416; opacity: 0.5; text-decoration: line-through; }

  .tree { position: relative; width: 100%; height: 300px; display: none; }
  .tree.active { display: block; animation: fadeIn 0.5s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 700; text-align: center; width: 100%; }

  /* --------- caption --------- */
  .caption {
    margin-top: 14px; color: var(--dim); font-size: 14.5px; line-height: 1.65; text-align: center;
    min-height: 4em; display: flex; align-items: center; justify-content: center; padding: 0 8px;
  }
  .caption b { color: var(--ink); }
  .caption .hl { color: var(--accent); font-weight: 700; }
  .caption .hl2 { color: var(--good); font-weight: 700; }
  .caption .hl3 { color: var(--violet); font-weight: 700; }
  .caption .say { background: #61dafb1f; border-radius: 4px; box-shadow: 0 1px 0 var(--accent); transition: background .15s; }

  /* --------- written log --------- */
  .log {
    background: #0e131a; border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; max-height: 520px; overflow-y: auto; height: 100%;
  }
  .log h3 { margin: 0 0 12px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  .logbody { font-family: var(--mono); font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .lrow {
    opacity: 0; transform: translateX(-6px); transition: .35s; color: #7d8b99;
    padding: 6px 0; display: flex; gap: 8px; border-left: 2px solid transparent; padding-left: 8px;
    border-bottom: 1px solid #161b22;
  }
  .lrow.in { opacity: 1; transform: none; }
  .lrow.new { color: var(--ink); border-left-color: var(--accent); background: linear-gradient(90deg, #61dafb0a, transparent); }
  .lrow .lk { color: var(--accent); font-weight: bold; min-width: 16px; }

  /* --------- code panel --------- */
  .code-panel {
    background: #0d1117; border: 1px solid var(--line); border-radius: 14px; 
    padding: 16px; margin-top: 16px; font-family: var(--mono); font-size: 13px;
    color: #e6edf3; overflow-x: auto; display: none; line-height: 1.5;
  }
  .code-panel pre { margin: 0; }
  .code-panel .kw { color: #ff7b72; } /* keyword */
  .code-panel .fn { color: #d2a8ff; } /* function */
  .code-panel .st { color: #a5d6ff; } /* string */
  .code-panel .cm { color: #8b949e; font-style: italic; } /* comment */


  /* --------- controls --------- */
  .controls { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin-top: 16px; }
  button.btn { background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
    padding: 9px 15px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; transition: .16s; }
  button.btn:hover:not(:disabled) { border-color: #46566b; background: #232c37; }
  button.btn:disabled { opacity: .35; cursor: not-allowed; }
  button.btn.primary { background: linear-gradient(180deg, #61dafb, #42b6d6); border-color: #61dafb; color: #0d1117; }
  button.btn.primary:hover:not(:disabled) { filter: brightness(1.1); }

  .spacer { flex: 1; }
  .pill { font-size: 11.5px; color: var(--faint); font-family: var(--mono); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .progress { height: 3px; background: #1b222b; border-radius: 2px; margin-top: 14px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); width: 0%; transition: width .35s; }

  /* --------- voice bar --------- */
  .voicebar { margin-top: 11px; padding-top: 13px; border-top: 1px solid var(--line); gap: 12px; }
  .voicebar .vgroup { display: flex; align-items: center; gap: 7px; color: var(--faint); font-size: 12px; }
  .voicebar label { letter-spacing: .1em; text-transform: uppercase; font-weight: 700; font-size: 10.5px; }
  .voicebar select { background: #0e141b; border: 1px solid var(--line); color: var(--ink); padding: 7px 9px; border-radius: 8px; font-size: 12.5px; max-width: 160px; }
  .voicebar select:focus { outline: none; border-color: var(--accent2); }
  .voicebar input[type=range] { width: 80px; accent-color: var(--accent); }
  .btn.speak { display: flex; align-items: center; gap: 7px; }
  .btn.speak.on { background: linear-gradient(180deg, #123a20, #0f2a19); border-color: var(--good); color: var(--good); }
  .vnote { font-size: 11.5px; color: var(--faint); font-style: italic; }

</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <svg viewBox="0 0 118 103" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M59.102 102.7c-7.92 0-15.54-1.39-22.38-4.04-6.85-2.65-12.79-6.42-17.47-11.08-4.68-4.66-8.47-10.59-11.13-17.43C5.46 63.3 4.06 55.7 4.06 47.78c0-7.93 1.4-15.53 4.06-22.38 2.66-6.84 6.45-12.77 11.13-17.43 4.68-4.66 10.62-8.43 17.47-11.08C43.56 1.4 51.18 0 59.1 0c7.93 0 15.54 1.4 22.39 4.04 6.84 2.65 12.78 6.42 17.46 11.08 4.67 4.66 8.46 10.59 11.13 17.43 2.65 6.85 4.05 14.45 4.05 22.38 0 7.92-1.4 15.52-4.05 22.37-2.67 6.84-6.46 12.77-11.13 17.43-4.68 4.66-10.62 8.43-17.46 11.08-6.85 2.65-14.46 4.04-22.39 4.04z" fill="#61DAFB" fill-opacity="0.1"/>
      <ellipse cx="59.1" cy="47.8" rx="23.9" ry="55.8" transform="rotate(-60 59.1 47.8)" stroke="#61DAFB" stroke-width="4"/>
      <ellipse cx="59.1" cy="47.8" rx="23.9" ry="55.8" transform="rotate(-120 59.1 47.8)" stroke="#61DAFB" stroke-width="4"/>
      <ellipse cx="59.1" cy="47.8" rx="23.9" ry="55.8" stroke="#61DAFB" stroke-width="4"/>
      <circle cx="59.1" cy="47.8" r="9.1" fill="#61DAFB"/>
    </svg>
    <h2>React Course<br>Masterclass</h2>
  </div>
  
  <div class="nav-group">
    <div class="nav-label">Foundations</div>
    <div id="tabs-foundations"></div>
    <div class="nav-label">Hooks & State</div>
    <div id="tabs-hooks"></div>
    <div class="nav-label">Architecture & Performance</div>
    <div id="tabs-arch"></div>
    <div class="nav-label">Components & APIs</div>
    <div id="tabs-apis"></div>
  </div>
</div>

<div class="main-area">
  <div class="wrap">
    <div class="eyebrow" id="pageSection">Section Name</div>
    <h1 id="pageTitle">React Topic</h1>
    <p class="sub" id="pageSub">Topic Description</p>

    <div class="card">
      <h2 id="lTitle"></h2>
      <p class="rule" id="lRule"></p>

      <div class="controls">
        <span class="pill" id="counter"></span>
        <div class="spacer"></div>
        <button class="btn speak" id="bVoice" aria-pressed="true" title="Toggle Voiceover">
          <span id="voiceIcon">🔊</span>
        </button>
        <button class="btn" id="bPrev">◀ Back</button>
        <button class="btn primary" id="bPlay">▶ Play</button>
        <button class="btn" id="bNext">Step ▶</button>
        <button class="btn" id="bReset">↺ Reset</button>
      </div>

      <div class="progress" style="margin-top: 0; margin-bottom: 16px;"><i id="prog"></i></div>

      <div class="split">
        <div style="display:flex; flex-direction:column; flex: 1; min-width:0;">
          <div class="board" id="board">
            <svg id="wires"></svg>
            <div class="sheet" id="sheet"></div>
          </div>
          <div class="caption" id="caption"></div>
          <div class="code-panel" id="codePanel">
            <pre><code id="codeBlock"></code></pre>
          </div>
        </div>

        <div class="log">
          <h3>Explanation Log</h3>
          <div class="logbody" id="logbody"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const board = $('board'), sheet = $('sheet'), wires = $('wires'),
      caption = $('caption'), logbody = $('logbody');

function el(tag, cls, txt){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
}

// Tree drawing helper
function drawTree(nodes, offsetX = 0, offsetY = 0) {
  const container = el('div', 'tree active');
  nodes.forEach(n => {
    const cls = n.sm ? `dom-node sm ${n.type}` : `dom-node ${n.type}`;
    const nodeEl = el('div', cls + (n.update ? ' update' : '') + (n.del ? ' del' : ''), n.label);
    nodeEl.style.left = `${150 + n.x + offsetX}px`;
    nodeEl.style.top = `${20 + n.y + offsetY}px`;
    nodeEl.id = n.id;
    container.appendChild(nodeEl);
  });
  return container;
}

// Wire drawing for tree connections
let pendingWires = [];
function wire(fromId, toId, color = '#30363d', dash = false) { pendingWires.push({fromId, toId, color, dash}); }

function drawWires(){
  wires.innerHTML = '';
  if (!pendingWires.length) return;
  const bb = board.getBoundingClientRect();
  wires.setAttribute('viewBox', `0 0 ${bb.width} ${bb.height}`);

  pendingWires.forEach(w => {
    const a = $(w.fromId);
    const b = $(w.toId);
    if (!a || !b) return;

    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const x1 = ra.left - bb.left + ra.width / 2, y1 = ra.bottom - bb.top;
    const x2 = rb.left - bb.left + rb.width / 2, y2 = rb.top - bb.top;

    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2}`);
    p.setAttribute('stroke', w.color);
    p.setAttribute('stroke-width', '2');
    if (w.dash) p.setAttribute('stroke-dasharray', '5 5');
    wires.appendChild(p);
  });
}

// =========================================================================
// 10 LESSONS FOR REACT COURSE
// =========================================================================

function lessonJSX() {
  const F = [];
  F.push({
    cap: `Browsers don't understand <span class="hl">JSX</span> natively. It's syntax sugar written by developers to make React code look like HTML.`,
    log: [['1', 'JSX looks like HTML markup']],
    build: s => {
      const b = el('div', 'box in highlight');
      b.innerHTML = `const el = &lt;h1 className="title"&gt;Hello&lt;/h1&gt;;`;
      s.appendChild(b);
    }
  });
  F.push({
    cap: `During the build process, a compiler like <span class="hl2">Babel</span> transforms this JSX into plain JavaScript function calls.`,
    log: [['2', 'Babel compiles JSX to React.createElement()']],
    build: s => {
      const b = el('div', 'box in highlight'); b.innerHTML = `const el = &lt;h1 className="title"&gt;Hello&lt;/h1&gt;;`;
      s.appendChild(b);
      const b2 = el('div', 'box in success'); b2.style.marginTop = '20px';
      b2.innerHTML = `React.createElement(<br>&nbsp;&nbsp;'h1',<br>&nbsp;&nbsp;{ className: 'title' },<br>&nbsp;&nbsp;'Hello'<br>);`;
      s.appendChild(b2);
    }
  });
  F.push({
    cap: `These function calls execute at runtime to return <span class="hl3">React Elements</span>. A React Element is just a plain Javascript Object that describes a DOM node.`,
    log: [['3', 'Returns a React Element (JS Object)']],
    build: s => {
      const b2 = el('div', 'box in dim'); b2.innerHTML = `React.createElement(...)`; s.appendChild(b2);
      const b3 = el('div', 'box in violet'); b3.style.marginTop = '20px';
      b3.innerHTML = `{<br>&nbsp;&nbsp;type: 'h1',<br>&nbsp;&nbsp;props: {<br>&nbsp;&nbsp;&nbsp;&nbsp;className: 'title',<br>&nbsp;&nbsp;&nbsp;&nbsp;children: 'Hello'<br>&nbsp;&nbsp;}<br>}`;
      s.appendChild(b3);
    }
  });
  return { F };
}

function lessonComponents() {
  const F = [];
  F.push({
    cap: `In React, we build UIs using <span class="hl">Components</span>. A component is essentially a JavaScript function that returns JSX.`,
    log: [['1', 'Components are functions returning JSX']],
    build: s => {
      const b = el('div', 'box in highlight');
      b.innerHTML = `<span style="color:var(--violet)">function</span> Profile() {<br>&nbsp;&nbsp;return &lt;div&gt;User Profile&lt;/div&gt;;<br>}`;
      s.appendChild(b);
    }
  });
  F.push({
    cap: `Components allow you to split the UI into independent, reusable pieces. You can pass data downwards into them using <span class="hl2">Props</span> (properties).`,
    log: [['2', 'Data flows down via Props']],
    build: s => {
      const app = el('div', 'box in'); app.style.border = '2px dashed #61dafb';
      app.innerHTML = '<div style="margin-bottom:10px; color:#61dafb;">&lt;App /&gt;</div>';
      const b1 = el('div', 'box in success'); b1.textContent = '<Profile name="Alice" />';
      const b2 = el('div', 'box in success'); b2.textContent = '<Profile name="Bob" />';
      app.append(b1, el('br'), b2);
      s.appendChild(app);
    }
  });
  F.push({
    cap: `Props are <span class="hl">strictly read-only</span>. Data in React flows one-way, from parent to child. A child component cannot modify the props it receives!`,
    log: [['3', 'Props are Read-Only (One-way data flow)']],
    build: s => {
      const b = el('div', 'box in warn');
      b.innerHTML = `<span style="color:var(--violet)">function</span> Profile(props) {<br>&nbsp;&nbsp;<span style="color:var(--warn); text-decoration:line-through">props.name = "Charlie"; // ERROR</span><br>&nbsp;&nbsp;return &lt;div&gt;{props.name}&lt;/div&gt;;<br>}`;
      s.appendChild(b);
    }
  });
  return { F };
}

function lessonStateBatching() {
  const F = [];
  
  F.push({
    cap: `Why can't we just use a normal javascript variable (<code>let count = 0</code>)? Because changing a normal variable does NOT tell React to update the UI!`,
    log: [['1', 'Normal variables do not trigger renders']],
    code: `<span class="kw">let</span> count = <span class="st">0</span>;\n\n<span class="kw">function</span> <span class="fn">Counter</span>() {\n  <span class="kw">return</span> (\n    &lt;<span class="fn">button</span> onClick={<span class="kw">() =&gt;</span> { count = <span class="st">1</span>; }}&gt;\n      Click me! (count is {count})\n    &lt;/<span class="fn">button</span>&gt;\n  );\n}`,
    build: s => {
      const b1 = el('div', 'box in warn'); b1.id = 'var'; b1.innerHTML = `let count = 0;<br>count = 1;`;
      const b2 = el('div', 'box in error'); b2.id = 'ui'; b2.innerHTML = `UI Screen<br><small>Still shows 0!</small>`;
      s.appendChild(b1); s.appendChild(b2);
      b1.style.top = '50px'; b1.style.left = '100px';
      b2.style.top = '150px'; b2.style.left = '100px';
    },
    after: () => wire('var','ui','red')
  });

  F.push({
    cap: `A React component is just a normal JavaScript function! When it re-renders, the function is simply called again from the top. All inner variables (like <code>let count = 0</code>) completely reset, wiping out your data!`,
    log: [['2', 'Normal variables reset on re-render']],
    code: `<span class="kw">function</span> <span class="fn">Counter</span>() {\n  <span class="cm">// If re-render happens, this resets to 0!</span>\n  <span class="kw">let</span> count = <span class="st">0</span>;\n  <span class="cm">/* ... */</span>\n}`,
    build: s => {
      const b1 = el('div', 'box in'); b1.id = 'ren'; b1.innerHTML = `Component Re-renders<br><small>(Function called again)</small>`;
      const b2 = el('div', 'box in error'); b2.id = 'var'; b2.innerHTML = `let count = 0;<br><small>(Data wiped out!)</small>`;
      s.appendChild(b1); s.appendChild(b2);
      b1.style.top = '50px'; b1.style.left = '90px';
      b2.style.top = '150px'; b2.style.left = '100px';
    },
    after: () => wire('ren','var','red')
  });

  F.push({

    code: `<span class="kw">import</span> { useState } <span class="kw">from</span> <span class="st">'react'</span>;\n\n<span class="kw">function</span> <span class="fn">Counter</span>() {\n  <span class="kw">const</span> [count, setCount] = <span class="fn">useState</span>(<span class="st">0</span>);\n  <span class="cm">/* ... */</span>\n}`,
    build: s => {

  F.push({

    log: [['4', 'Setter function queues a re-render']],
    code: `<span class="kw">function</span> <span class="fn">Counter</span>() {\n  <span class="kw">const</span> [count, setCount] = <span class="fn">useState</span>(<span class="st">0</span>);\n  <span class="kw">return</span> &lt;<span class="fn">button</span> onClick={<span class="kw">() =&gt;</span> <span class="fn">setCount</span>(<span class="st">1</span>)}&gt;Click!&lt;/<span class="fn">button</span>&gt;;\n}`,
    build: s => {

      b2.style.top = '150px'; b2.style.left = '80px';

  F.push({
    cap: `A great optimization trick: What happens if you call <code>setCount</code> multiple times synchronously? React 18 uses <span class="hl">Automatic Batching</span>. It groups multiple state updates into a single re-render for performance!`,

    code: `<span class="kw">function</span> <span class="fn">handleClick</span>() {\n  <span class="cm">// React waits until this function finishes</span>\n  <span class="fn">setCount</span>(<span class="st">1</span>);\n  <span class="fn">setCount</span>(<span class="st">2</span>);\n  <span class="fn">setCount</span>(<span class="st">3</span>);\n  <span class="cm">// Only *then* does it trigger ONE re-render!</span>\n}`,

  F.push({
    cap: `If you need to update state based on its <i>previous</i> value, passing <code>count + 1</code> multiple times will fail due to batching. You must pass an <span class="hl">updater function</span>!`,
    log: [['6', 'Updater functions queue state transforms']],
    code: `<span class="kw">function</span> <span class="fn">handleClick</span>() {\n  <span class="cm">// WRONG: uses stale 'count' value</span>\n  <span class="fn">setCount</span>(count + <span class="st">1</span>); \n  <span class="fn">setCount</span>(count + <span class="st">1</span>);\n\n  <span class="cm">// RIGHT: queues based on previous state</span>\n  <span class="fn">setCount</span>(prev =&gt; prev + <span class="st">1</span>);\n  <span class="fn">setCount</span>(prev =&gt; prev + <span class="st">1</span>);\n}`,
    build: s => {

function lessonUseEffect() {
  const F = [];
  
  F.push({
    cap: `If your component needs to do external work (like fetching data or setting timers), doing it directly inside the function blocks React! The browser won't be able to paint the UI until the API finishes.`,
    log: [['1', 'Synchronous side-effects block rendering']],
    code: `<span class="kw">function</span> <span class="fn">Profile</span>() {\n  <span class="cm">// BAD: Blocks React render and UI paint!</span>\n  <span class="kw">const</span> data = <span class="fn">fetchDataSync</span>();\n\n  <span class="kw">return</span> &lt;<span class="fn">div</span>&gt;{data}&lt;/<span class="fn">div</span>&gt;;\n}`,
    build: s => {
      const b1 = el('div', 'box in error'); b1.id = 'render'; b1.innerHTML = `Component Render<br><small>fetchData() (Waiting...)</small>`;
      const b2 = el('div', 'box in'); b2.id = 'paint'; b2.innerHTML = `Browser Paint<br><small>(Blocked! Screen is blank)</small>`;
      s.appendChild(b1); s.appendChild(b2);
      b1.style.top = '50px'; b1.style.left = '100px';
      b2.style.top = '150px'; b2.style.left = '100px';
    },
    after: () => wire('render','paint','red')
  });

  F.push({
    cap: `The <span class="hl">useEffect</span> hook fixes this! It pushes the side-effect <i>outside</i> the render cycle. The browser paints the UI instantly, and <i>then</i> the Effect runs in the background.`,
    log: [['2', 'useEffect runs after browser paint']],
    code: `<span class="kw">import</span> { useEffect } <span class="kw">from</span> <span class="st">'react'</span>;\n\n<span class="kw">function</span> <span class="fn">Profile</span>() {\n  <span class="cm">// GOOD: Runs in background after paint!</span>\n  <span class="fn">useEffect</span>(<span class="kw">() =&gt;</span> {\n    <span class="fn">fetchData</span>();\n  });\n\n  <span class="kw">return</span> &lt;<span class="fn">div</span>&gt;Loading...&lt;/<span class="fn">div</span>&gt;;\n}`,
    build: s => {
      const b1 = el('div', 'box in'); b1.id = 'render'; b1.innerHTML = `Component Render`;
      const b2 = el('div', 'box in success'); b2.id = 'paint'; b2.innerHTML = `Browser Paint<br><small>(UI is visible!)</small>`;
      const b3 = el('div', 'box in highlight'); b3.id = 'eff'; b3.innerHTML = `useEffect()<br><small>fetchData()</small>`;
      s.appendChild(b1); s.appendChild(b2); s.appendChild(b3);
      b1.style.top = '20px'; b1.style.left = '100px';
      b2.style.top = '100px'; b2.style.left = '100px';
      b3.style.top = '180px'; b3.style.left = '100px';
    },
    after: () => { wire('render','paint','#2ea043'); wire('paint','eff'); }
  });

  F.push({
    cap: `The <span class="hl3">Dependency Array</span> (the second argument) controls when the effect runs. If you pass an empty array <code>[]</code>, it runs exactly once when the component Mounts.`,
    log: [['3', 'Empty array runs once on mount']],
    code: `<span class="kw">function</span> <span class="fn">Profile</span>() {\n  <span class="fn">useEffect</span>(<span class="kw">() =&gt;</span> {\n    <span class="fn">console</span>.log(<span class="st">"Component Mounted!"</span>);\n  }, []); <span class="cm">// &lt;- Empty array means runs ONLY once</span>\n}`,
    build: s => {
      const b1 = el('div', 'box in'); b1.id = 'ren1'; b1.innerHTML = `Initial Mount`;
      const b2 = el('div', 'box in success'); b2.id = 'eff1'; b2.innerHTML = `useEffect(() => {}, [])<br><small>(Executes)</small>`;
      const b3 = el('div', 'box in'); b3.id = 'ren2'; b3.innerHTML = `Re-render`;
      const b4 = el('div', 'box in warn'); b4.id = 'eff2'; b4.innerHTML = `useEffect(() => {}, [])<br><small>(Skipped)</small>`;
      s.appendChild(b1); s.appendChild(b2); s.appendChild(b3); s.appendChild(b4);
      b1.style.top = '30px'; b1.style.left = '30px';
      b2.style.top = '30px'; b2.style.left = '200px';
      b3.style.top = '130px'; b3.style.left = '30px';
      b4.style.top = '130px'; b4.style.left = '200px';
    },
    after: () => { wire('ren1','eff1','#2ea043'); wire('ren2','eff2','orange'); }
  });

  F.push({
    cap: `If you pass variables into the array like <code>[id]</code>, React checks if the <code>id</code> changed since the last render. If it did, the effect runs again! If omitted completely, it runs on <i>every</i> render.`,
    log: [['4', 'Dependency Array triggers on value change']],
    code: `<span class="kw">function</span> <span class="fn">Profile</span>({ id }) {\n  <span class="fn">useEffect</span>(<span class="kw">() =&gt;</span> {\n    <span class="fn">fetchUser</span>(id);\n  }, [id]); <span class="cm">// &lt;- Runs when 'id' changes</span>\n}`,
    build: s => {
      const b1 = el('div', 'box'); b1.id = 'ren1'; b1.innerHTML = `Re-render<br><small>id: 5</small>`;
      const b2 = el('div', 'box success'); b2.id = 'eff1'; b2.innerHTML = `useEffect(() => {}, [id])<br><small>(Executes - ID changed)</small>`;
      s.appendChild(b1); s.appendChild(b2);
      b1.style.top = '80px'; b1.style.left = '30px';
      b2.style.top = '80px'; b2.style.left = '200px';
    },
    after: () => { wire('ren1','eff1','#2ea043'); }
  });

  F.push({
    cap: `You can optionally return a <span class="hl2">Cleanup Function</span>. React runs this before the component unmounts, or before running the effect again. Crucial for destroying WebSockets or Timers to prevent memory leaks!`,
    log: [['5', 'Cleanup function prevents memory leaks']],
    code: `<span class="kw">function</span> <span class="fn">Timer</span>() {\n  <span class="fn">useEffect</span>(<span class="kw">() =&gt;</span> {\n    <span class="kw">const</span> id = <span class="fn">setInterval</span>(tick, <span class="st">1000</span>);\n    <span class="kw">return</span> <span class="kw">() =&gt;</span> <span class="fn">clearInterval</span>(id); <span class="cm">// Cleanup!</span>\n  }, []);\n}`,
    build: s => {
      const comp = el('div', 'box in warn');
      comp.innerHTML = `useEffect(() => {<br>&nbsp;&nbsp;const timer = setInterval(...);<br>&nbsp;&nbsp;<span style="color:var(--accent)">return () => clearInterval(timer);</span><br>}, []);`;
      s.appendChild(comp);
      comp.style.top = '80px'; comp.style.left = '60px';
    }
  });

  return { F };
}

  F.push({

  const vdomTree2 = [

    {id:'v3', sm:true, type:'vdom update', label:'p*', x:50, y:60, update:true},

  F.push({
    cap: `Upon state change, React creates a new VDOM tree and compares it to the old one. This Diffing algorithm is called <span class="hl3">Reconciliation</span>.`,

      wire('r1','r2','#3fb950'); wire('r1','r3','#3fb950');
      wire('v3','r3','#61dafb',true); // highlight change
    }

  const listTree1 = [

    {id:'l3', sm:true, type:'vdom update', label:'A', x:0, y:90, update:true},
    {id:'l4', sm:true, type:'vdom update', label:'B', x:50, y:60, update:true},
  ];
  F.push({
    cap: `Important Concept: <b>Keys in Lists</b>. If you add an element to the TOP of a list without a <code>key</code> prop, React thinks every single child changed and re-renders them all!`,
    log: [['3', 'Without keys, inserting at top mutates every child']],
    build: s => {
      s.appendChild(el('div', 'label', 'List without keys (Prepending "C")'));
      s.appendChild(drawTree(listTree1, -120));
      s.appendChild(drawTree(listTree2, 120, -320));
    },
    after: () => {
      wire('l1','l2','#bc8cff'); wire('l1','l3','#bc8cff'); wire('l1','l4','#bc8cff');
    }
  });

  const listTree3 = [
    {id:'l1', sm:true, type:'vdom', label:'ul', x:0, y:0},
    {id:'l2', sm:true, type:'vdom update', label:'C', x:-50, y:60, update:true},

    }
  });
  return { F };
}

function lessonUseEffectEvent() {

    },

  });

  F.push({
    cap: `Because <code>theme</code> is a reactive dependency, every time the user toggles dark mode, the Effect re-runs! This causes the chat to completely disconnect and reconnect just because the theme changed.`,
    log: [['2', 'Theme change causes reconnect']],
    build: s => {
      const b1 = el('div', 'box'); b1.id = 'chat'; b1.innerHTML = `Chat Room<br><small>roomId: 'general'</small>`;

      const b3 = el('div', 'box highlight'); b3.id = 'th'; b3.innerHTML = `Theme: light`;
      s.appendChild(b1); s.appendChild(b2); s.appendChild(b3);
      b1.style.top = '20px'; b1.style.left = '150px';
      b2.style.top = '120px'; b2.style.left = '100px';
      b3.style.top = '220px'; b3.style.left = '150px';
    },
    after: () => { wire('th','eff', 'red'); }
  });

  F.push({
    cap: `<code>useEffectEvent</code> fixes this! It lets you wrap the non-reactive part (reading the theme) into an "Event".`,
    log: [['3', 'Wrap theme read in useEffectEvent']],
    build: s => {

      const b2 = el('div', 'box in warn'); b2.id = 'eff'; b2.innerHTML = `useEffect(() => {<br>&nbsp;&nbsp;connect(roomId);<br>&nbsp;&nbsp;onConnect();<br>}, [roomId])`;
      s.appendChild(b1); s.appendChild(b2);
      b1.style.top = '40px'; b1.style.left = '80px';
      b2.style.top = '160px'; b2.style.left = '80px';

    after: () => { wire('ev','eff'); }
  });

  F.push({
    cap: `Now, <code>theme</code> is safely read when needed, but it is NO LONGER a dependency of the Effect! Toggling the theme updates the Event, but doesn't re-run the connection logic.`,
    log: [['4', 'Effect only runs when roomId changes']],
    build: s => {
      const b1 = el('div', 'box'); b1.id = 'chat'; b1.innerHTML = `Chat Room<br><small>roomId: 'general'</small>`;
      const b2 = el('div', 'box success'); b2.id = 'eff'; b2.innerHTML = `Connected ✅`;

}

// =========================================================================
// Player Engine
// =========================================================================
const LESSON_CODES = {
  jsx: `<span class="kw">function</span> <span class="fn">App</span>() {\\n  <span class="kw">return</span> &lt;<span class="fn">h1</span> className=<span class="st">"title"</span>&gt;Hello JSX!&lt;/<span class="fn">h1</span>&gt;;\\n}`,
  components: `<span class="kw">function</span> <span class="fn">Button</span>({ label }) {\\n  <span class="kw">return</span> &lt;<span class="fn">button</span>&gt;{label}&lt;/<span class="fn">button</span>&gt;;\\n}\\n\\n<span class="kw">function</span> <span class="fn">App</span>() {\\n  <span class="kw">return</span> &lt;<span class="fn">Button</span> label=<span class="st">"Click Me"</span> /&gt;;\\n}`,
  vdom: `<span class="cm">// React uses the Virtual DOM under the hood</span>\\n<span class="kw">const</span> vdomNode = {\\n  type: <span class="st">'h1'</span>,\\n  props: { className: <span class="st">'title'</span> },\\n  children: [<span class="st">'Hello VDOM!'</span>]\\n};`,
  usestate: `<span class="kw">import</span> { useState } <span class="kw">from</span> <span class="st">'react'</span>;\\n\\n<span class="kw">function</span> <span class="fn">Counter</span>() {\\n  <span class="kw">const</span> [count, setCount] = <span class="fn">useState</span>(<span class="st">0</span>);\\n  <span class="kw">return</span> &lt;<span class="fn">button</span> onClick={<span class="kw">() =&gt;</span> <span class="fn">setCount</span>(prev =&gt; prev + <span class="st">1</span>)}&gt;{count}&lt;/<span class="fn">button</span>&gt;;\\n}`,
  useeffect: `<span class="kw">import</span> { useEffect } <span class="kw">from</span> <span class="st">'react'</span>;\\n\\n<span class="kw">function</span> <span class="fn">DataFetcher</span>({ id }) {\\n  <span class="fn">useEffect</span>(<span class="kw">() =&gt;</span> {\\n    <span class="kw">const</span> sub = <span class="fn">api.subscribe</span>(id);\\n    <span class="kw">return</span> <span class="kw">() =&gt;</span> sub.unsubscribe();\\n  }, [id]);\\n}`,
  useref: `<span class="kw">import</span> { useRef } <span class="kw">from</span> <span class="st">'react'</span>;\\n\\n<span class="kw">function</span> <span class="fn">InputFocus</span>() {\\n  <span class="kw">const</span> inputRef = <span class="fn">useRef</span>(<span class="kw">null</span>);\\n  <span class="kw">return</span> &lt;<span class="fn">input</span> ref={inputRef} /&gt;;\\n}`,
  customhooks: `<span class="kw">function</span> <span class="fn">useWindowWidth</span>() {\\n  <span class="kw">const</span> [width, setWidth] = <span class="fn">useState</span>(<span class="fn">window</span>.innerWidth);\\n  <span class="fn">useEffect</span>(<span class="kw">() =&gt;</span> { <span class="cm">/* ... */</span> }, []);\\n  <span class="kw">return</span> width;\\n}`,
  usereducer: `<span class="kw">const</span> <span class="fn">reducer</span> = (state, action) =&gt; {\\n  <span class="kw">if</span> (action.type === <span class="st">'increment'</span>) <span class="kw">return</span> { count: state.count + <span class="st">1</span> };\\n};\\n\\n<span class="kw">const</span> [state, dispatch] = <span class="fn">useReducer</span>(reducer, { count: <span class="st">0</span> });`,
  usecontext: `<span class="kw">const</span> ThemeContext = <span class="fn">createContext</span>(<span class="st">'light'</span>);\\n\\n<span class="kw">function</span> <span class="fn">Child</span>() {\\n  <span class="kw">const</span> theme = <span class="fn">useContext</span>(ThemeContext);\\n  <span class="kw">return</span> &lt;<span class="fn">div</span> className={theme}&gt;Themed!&lt;/<span class="fn">div</span>&gt;;\\n}`,
  usememo: `<span class="kw">const</span> expensiveResult = <span class="fn">useMemo</span>(<span class="kw">() =&gt;</span> {\\n  <span class="kw">return</span> <span class="fn">computeHeavyData</span>(items);\\n}, [items]);`,
  usecallback: `<span class="kw">const</span> memoizedCallback = <span class="fn">useCallback</span>(<span class="kw">() =&gt;</span> {\\n  <span class="fn">doSomething</span>(data);\\n}, [data]);`,
  usetransition: `<span class="kw">const</span> [isPending, startTransition] = <span class="fn">useTransition</span>();\\n\\n<span class="kw">function</span> <span class="fn">handleClick</span>() {\\n  <span class="fn">startTransition</span>(<span class="kw">() =&gt;</span> {\\n    <span class="fn">setHeavyList</span>(newList);\\n  });\\n}`,
  useactionstate: `<span class="kw">const</span> [state, formAction] = <span class="fn">useActionState</span>(updateUser, { error: <span class="kw">null</span> });\\n\\n&lt;<span class="fn">form</span> action={formAction}&gt;\\n  &lt;<span class="fn">button</span> type=<span class="st">"submit"</span>&gt;Save&lt;/<span class="fn">button</span>&gt;\\n&lt;/<span class="fn">form</span>&gt;`,
  useoptimistic: `<span class="kw">const</span> [optimisticName, setOptimisticName] = <span class="fn">useOptimistic</span>(name);\\n\\n<span class="cm">// UI updates instantly before server confirms!</span>`,
  use: `<span class="kw">function</span> <span class="fn">Profile</span>({ userPromise }) {\\n  <span class="kw">const</span> user = <span class="fn">use</span>(userPromise); <span class="cm">// Suspends if pending!</span>\\n  <span class="kw">return</span> &lt;<span class="fn">h1</span>&gt;{user.name}&lt;/<span class="fn">h1</span>&gt;;\\n}`,
  suspense: `&lt;<span class="fn">Suspense</span> fallback={&lt;<span class="fn">Spinner</span> /&gt;}&gt;\\n  &lt;<span class="fn">LazyProfile</span> /&gt;\\n&lt;/<span class="fn">Suspense</span>&gt;`,
  lazy: `<span class="kw">const</span> LazyProfile = <span class="fn">lazy</span>(<span class="kw">() =&gt;</span> <span class="fn">import</span>(<span class="st">'./Profile'</span>));`,
  createcontext: `<span class="kw">export const</span> ThemeContext = <span class="fn">createContext</span>(<span class="st">'dark'</span>);\\n\\n&lt;<span class="fn">ThemeContext.Provider</span> value=<span class="st">"light"</span>&gt;\\n  &lt;<span class="fn">App</span> /&gt;\\n&lt;/<span class="fn">ThemeContext.Provider</span>&gt;`
};

let current = 0, model = null, ix = 0, timer = null;

function buildTabs(){
  $('tabs-foundations').innerHTML = '';
  $('tabs-hooks').innerHTML = '';
  $('tabs-arch').innerHTML = '';
  $('tabs-apis').innerHTML = '';

  LESSONS.forEach((L, i) => {
    const b = el('div', 'menu-item' + (i === current ? ' active' : ''));
    b.appendChild(el('span','n',String(i+1)));
    b.appendChild(el('span','',L.tab));
    b.onclick = () => selectLesson(i);
    
    if (L.group === 'foundations') $('tabs-foundations').appendChild(b);
    if (L.group === 'hooks') $('tabs-hooks').appendChild(b);
    if (L.group === 'arch') $('tabs-arch').appendChild(b);
    if (L.group === 'apis') $('tabs-apis').appendChild(b);
  });
}

function selectLesson(i){
  stop(); current = i;
  buildTabs(); rebuild();
}

function getGroupName(group) {
  if (group === 'foundations') return 'Foundations';
  if (group === 'hooks') return 'Hooks & State';
  if (group === 'arch') return 'Architecture & Performance';
  if (group === 'apis') return 'Components & APIs';
  return '';
}

function rebuild(){
  stop();
  const L = LESSONS[current];
  $('pageSection').textContent = getGroupName(L.group);
  $('pageTitle').textContent = L.title;
  $('pageSub').textContent = L.sub;
  $('lTitle').textContent = L.tab + ' Workflow';
  $('lRule').innerHTML = L.rule;

  model = L.build();
  ix = 0;
  
  sheet.innerHTML = '';
  wires.innerHTML = '';
  pendingWires = [];
  caption.innerHTML = '<b>Click ▶ Play to start</b>';
  logbody.innerHTML = '';
  $('prog').style.width = '0%';
  $('counter').textContent = `step 0 / ${model.F.length}`;
  
  const cp = $('codePanel');
  const code = LESSON_CODES[L.id] || (model.F.find(f => f.code) || {}).code;
  if (code) {
    cp.style.display = 'block';
    $('codeBlock').innerHTML = code;
  } else {
    cp.style.display = 'none';
    $('codeBlock').innerHTML = '';
  }

  $('bPrev').disabled = true;
  $('bNext').disabled = false;
  $('bPlay').disabled = false;
  $('bReset').disabled = true;
}

function draw(){
  if (!model) return;
  const f = model.F[ix];

  sheet.innerHTML = '';
  wires.innerHTML = '';
  pendingWires = [];

  caption.innerHTML = f.cap;
  if(f.build) f.build(sheet);
  const boxes = [...sheet.querySelectorAll('.box, .dom-node')];
  boxes.forEach((b,i) => setTimeout(() => b.classList.add('in'), i * 80));

  setTimeout(() => { drawWires(); if (f.after) f.after(); }, boxes.length * 80 + 50);

  renderLog();
  $('prog').style.width = ((ix+1) / model.F.length * 100) + '%';
  $('counter').textContent = `step ${ix+1} / ${model.F.length}`;
  setButtons();
}

function renderLog(){
  logbody.innerHTML = '';
  for (let i = 0; i <= ix; i++){
    const f = model.F[i];
    if (!f.log) continue;
    f.log.forEach(([k, text]) => {
      const r = el('div', 'lrow' + (i === ix ? ' new' : ''));
      if (k) r.appendChild(el('span','lk', k+'.'));
      const v = el('span'); v.textContent = text; r.appendChild(v);
      logbody.appendChild(r);
      requestAnimationFrame(() => r.classList.add('in'));
    });
  }
  logbody.scrollTop = logbody.scrollHeight;
}

function setButtons(){
  const isStarted = !caption.innerHTML.includes('start');
  $('bPrev').disabled = !model || ix === 0 || !isStarted;
  $('bNext').disabled = !model || (isStarted && ix >= model.F.length - 1);
  $('bPlay').disabled = !model;
  $('bReset').disabled = !isStarted;
}

// =========================================================================
// Voiceover API & Audio Control
// =========================================================================
const speech = {
  supported: typeof window !== 'undefined' && 'speechSynthesis' in window,
  on: true, 
  voice: null, 
  rate: 0.95, 
  token: 0
};

function speakableText(html){
  let t = html.replace(/<[^>]+>/g, '');
  t = t.replace(/&nbsp;/g, ' ').replace(/&lt;/g, 'less than').replace(/&gt;/g, 'greater than');
  t = t.replace(/JSX/g, 'J S X').replace(/DOM/g, 'dom').replace(/VDOM/g, 'V dom').replace(/useFetch/g, 'use fetch');
  return t.trim();
}

function loadVoice(){
  if (!speech.supported) return;
  const all = speechSynthesis.getVoices();
  if (!all.length) return;
  // Pick best available English voice automatically
  speech.voice = all.find(v => v.name.includes('Google US English')) || all.find(v => /^en/i.test(v.lang)) || all[0];
}

function say(html, onEnd){
  if (!speech.supported || !speech.on){ if (onEnd) onEnd(); return; }
  speechSynthesis.cancel();

  const text = speakableText(html);
  if (!text){ if (onEnd) onEnd(); return; }

  const myToken = ++speech.token;
  const u = new SpeechSynthesisUtterance(text);
  if (speech.voice) u.voice = speech.voice;
  u.rate = speech.rate;
  u.onend = () => { if (myToken === speech.token && onEnd) onEnd(); };
  u.onerror = e => { if (myToken === speech.token && onEnd) onEnd(); };
  speechSynthesis.speak(u);
}

function shutUp(){
  speech.token++;
  if (speech.supported) speechSynthesis.cancel();
}

function initVoice(){
  if (!speech.supported) return;
  loadVoice();
  speechSynthesis.onvoiceschanged = loadVoice;
}

$('bVoice').onclick = () => {
  speech.on = !speech.on;
  $('bVoice').setAttribute('aria-pressed', speech.on);
  $('voiceIcon').textContent = speech.on ? '🔊' : '🔇';
  if(!speech.on){
    shutUp();
  } else {
    // Only speak if a lesson frame is actively playing/shown
    if (!caption.innerHTML.includes('start') && model && model.F[ix]) {
      say(model.F[ix].cap);
    }
  }
};

initVoice();


// =========================================================================
// Controls
// =========================================================================
function next(){
  if (!model) return;
  if (caption.innerHTML.includes('start')) {
    draw();
  } else if (ix < model.F.length - 1) {
    ix++; draw();
  }
  if (!playing && speech.on) say(model.F[ix].cap);
}
function prev(){
  if (!model || ix === 0 || caption.innerHTML.includes('start')) return;
  ix--; draw();
  if (!playing && speech.on) say(model.F[ix].cap);
}

let playing = false;
function advance(){
  if (!playing) return;
  if (ix >= model.F.length - 1){ stop(); return; }
  ix++; draw();
  narrateThenContinue();
}

function narrateThenContinue(){
  if (!playing) return;
  if (speech.on && speech.supported){
    say(model.F[ix].cap, () => { timer = setTimeout(advance, 800); });
  } else {
    timer = setTimeout(advance, 3000);
  }
}

function play(){
  if (!model) return;
  if (playing){ stop(); return; }
  playing = true;
  
  if (caption.innerHTML.includes('start')) {
    draw();
  } else if (ix >= model.F.length-1){ 
    ix = 0; draw(); 
  }
  
  $('bPlay').textContent = '⏸ Pause';
  narrateThenContinue();
}

function stop(){
  playing = false;
  if (timer) clearTimeout(timer);
  timer = null;
  shutUp();
  $('bPlay').textContent = '▶ Play';
}

$('bNext').onclick  = () => { stop(); next(); };
$('bPrev').onclick  = () => { stop(); prev(); };
$('bPlay').onclick  = play;
$('bReset').onclick = () => { stop(); ix = 0; draw(); if (speech.on) say(model.F[ix].cap); };

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight'){ stop(); next(); }
  if (e.key === 'ArrowLeft'){ stop(); prev(); }
  if (e.key === ' '){ e.preventDefault(); play(); }
  if (e.key === 'v' || e.key === 'V'){ setVoiceOn(!speech.on); }
  if (e.key === 'r' || e.key === 'R'){ $('bRepeat').onclick(); }
});
window.addEventListener('resize', () => { if (model) drawWires(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
window.addEventListener('beforeunload', shutUp);

initVoice();
selectLesson(0);
</script>
